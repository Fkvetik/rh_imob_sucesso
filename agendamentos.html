<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CRM Agendamentos — RH Imob</title>
<style>
  :root{
    --wa-green:#25D366; --wa-dark:#075E54;
    /* paleta validada (dataviz) */
    --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --gridline:#e1e0d9; --baseline:#c3c2b7;
    --series-1:#2a78d6; --series-2:#1baf7a; --series-3:#eda100; --series-4:#008300; --series-5:#4a3aa7; --series-6:#e34948;
    --seq-blue-300:#6da7ec; --seq-blue-450:#2a78d6; --seq-blue-600:#184f95;
  }
  *{box-sizing:border-box}
  body{font-family:system-ui,Arial;margin:0;background:#f0f2f5;color:#111}
  header{background:#111;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;flex:1}
  header input{padding:8px 12px;border-radius:8px;border:0;min-width:220px}
  header select{padding:8px 12px;border-radius:8px;border:0;font-size:12px}
  header button{padding:8px 14px;border-radius:8px;border:0;cursor:pointer;font-size:12px;background:rgba(255,255,255,.15);color:#fff}
  header button.primary{background:var(--wa-green);color:#fff;font-weight:700}
  .hide{display:none !important}

  .tabs{display:flex;gap:6px;padding:14px 20px 0}
  .tab-btn{padding:9px 16px;border-radius:10px 10px 0 0;border:1px solid #dde1e7;border-bottom:none;background:#e4e7eb;color:#555;cursor:pointer;font-size:13px;font-weight:600}
  .tab-btn.active{background:#f0f2f5;color:#111}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  .agcard.atrasado{border:1.5px solid #e34948;box-shadow:0 0 0 1px rgba(227,73,72,.15)}
  .badge-atrasado{display:inline-block;font-size:10px;background:#fdecea;color:#c0392b;border-radius:999px;padding:1px 6px;margin-top:4px;font-weight:700}

  .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px}
  #loginArea{max-width:360px;margin:60px auto}
  label{font-weight:600;font-size:12px;color:#333;display:block;margin-top:10px}
  input,textarea,select{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border:1px solid #ccc;border-radius:8px;font-size:13px;font-family:inherit}

  /* Dashboard */
  #dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px 20px 0}
  .stat{background:#fff;border-radius:12px;padding:14px;border:1px solid #eee}
  .stat .num{font-size:22px;font-weight:800;color:#111}
  .stat .label{font-size:11px;color:#777;margin-top:2px}
  .stat.wide{grid-column:span 2}
  .stat ul{list-style:none;margin:6px 0 0;padding:0;font-size:11px;color:#555}
  .stat li{display:flex;justify-content:space-between;padding:2px 0}

  /* Charts */
  #charts{display:flex;gap:14px;padding:16px 20px 0;flex-wrap:wrap}
  .chart-card{background:var(--surface-1);border:1px solid #eee;border-radius:12px;padding:16px;flex:1;min-width:280px;position:relative}
  .chart-card h4{margin:0 0 10px;font-size:12px;color:var(--text-secondary);font-weight:700}
  .chart-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
  .chart-legend .li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary)}
  .chart-legend .swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0}
  .chart-tooltip{position:fixed;background:var(--text-primary);color:#fff;font-size:11px;padding:5px 8px;border-radius:6px;pointer-events:none;z-index:600;opacity:0;transition:opacity .1s;white-space:nowrap}
  .chart-tooltip.show{opacity:1}
  .bar-rect{transition:opacity .1s}
  .bar-rect:hover{opacity:.75;cursor:pointer}
  .donut-seg{transition:opacity .1s;cursor:pointer}
  .donut-seg:hover{opacity:.75}
  .chart-empty{font-size:11px;color:var(--text-muted);text-align:center;padding:30px 0}

  /* Kanban */
  #board{display:flex;gap:14px;padding:16px 20px;overflow-x:auto;align-items:flex-start}
  .column{background:#e9edf0;border-radius:12px;min-width:250px;max-width:250px;display:flex;flex-direction:column;max-height:calc(100vh - 260px)}
  .col-header{padding:10px 12px;border-bottom:2px solid var(--col-color,#3498db);font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center}
  .col-count{background:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;color:#555}
  .col-body{padding:8px;overflow-y:auto;flex:1;min-height:60px}
  .col-body.drag-over{background:#dfe9e3}
  .empty-col{text-align:center;color:#999;font-size:11px;padding:20px 8px}
  .agcard{background:#fff;border-radius:10px;padding:9px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:grab;font-size:12px}
  .agcard .nome{font-weight:700}
  .agcard .sub{color:#666;font-size:11px;margin-top:2px}
  .agcard .badge2{display:inline-block;font-size:10px;background:#fff3e0;color:#e65100;border-radius:999px;padding:1px 6px;margin-top:4px}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:500}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;padding:22px;width:440px;max-height:85vh;overflow-y:auto}
  .modal h3{margin-top:0;font-size:15px}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  button.ghost{background:#eee;color:#333;padding:9px 14px;border-radius:8px;border:0;cursor:pointer;font-size:13px}
  button.primary2{background:#111;color:#fff;padding:9px 14px;border-radius:8px;border:0;cursor:pointer;font-size:13px}
  .hist-item{border-left:2px solid #ddd;padding:4px 0 4px 10px;font-size:11px;color:#555;margin-bottom:4px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .wa-btn{display:inline-flex;align-items:center;gap:5px;background:#e6f9ee;color:#128c4a;text-decoration:none;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700}
  .wa-btn:hover{background:#d3f3e2}
  .wa-btn-sm{display:inline-flex;align-items:center;justify-content:center;background:#e6f9ee;color:#128c4a;text-decoration:none;width:22px;height:22px;border-radius:6px;font-size:12px;flex-shrink:0}
  .wa-btn-sm:hover{background:#c9efdc}
  .day-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;font-size:12px}
  .day-item .info{min-width:0}
  .day-item .nome{font-weight:700}
  .day-item .sub{color:#666;font-size:11px}

  /* Gerenciar colunas */
  .col-row{display:flex;align-items:center;gap:8px;padding:6px;background:#f8f9fa;border-radius:8px;border:1px solid #eee;margin-bottom:6px}
  .col-row.drag-over{border:2px dashed #25D366;background:#f0fdf4}
  .col-row input[type="text"]{flex:1;margin:0}
  .col-row input[type="color"]{width:36px;height:34px;padding:2px;border:1px solid #ddd;border-radius:6px;cursor:pointer;flex-shrink:0}
  .col-drag-handle{cursor:grab;font-size:16px;color:#ccc;padding:0 2px;flex-shrink:0}
  .rm-col-btn{border:none;background:#fdecea;color:#c0392b;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:13px;flex-shrink:0}
</style>
</head>
<body>
<header>
  <h1>🗓 CRM Agendamentos — RH Imob</h1>
  <input id="searchInput" placeholder="Buscar por nome, telefone, empresa ou operador..." autocomplete="off" readonly>
  <select id="filtroOperador"><option value="">Todos os operadores</option></select>
  <button id="btnExportCsv">⬇️ Exportar CSV</button>
  <button id="btnColunas">⚙️ Colunas</button>
  <button id="btnRefresh">↻ Atualizar</button>
</header>

<div id="loginArea">
  <div class="card">
    <label>Senha de admin</label>
    <input id="adminPass" type="password" placeholder="••••••••">
    <div style="margin-top:10px"><button class="primary2" id="btnEntrar">Entrar</button></div>
    <div id="loginMsg" style="font-size:12px;margin-top:8px"></div>
  </div>
</div>

<div id="appArea" class="hide">
  <div class="tabs">
    <button class="tab-btn" id="tabBtnKanban">🗓 Kanban</button>
    <button class="tab-btn" id="tabBtnVisaoGeral">📊 Visão Geral</button>
  </div>
  <div id="tabKanban" class="tab-panel">
    <div id="board"></div>
  </div>
  <div id="tabVisaoGeral" class="tab-panel">
    <div id="dashboard"></div>
    <div id="charts"></div>
  </div>
  <div class="chart-tooltip" id="chartTooltip"></div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3 id="mNomeCandidato">Agendamento</h3>
    <div style="font-size:12px;color:#666" id="mSubInfo"></div>
    <div class="btns" style="margin:8px 0"><a id="mWaLink" href="#" target="_blank" class="wa-btn">💬 Abrir WhatsApp</a></div>

    <label>Etapa</label>
    <select id="mStatus"></select>

    <label>Data/hora (atual ou novo reagendamento)</label>
    <input id="mData" type="datetime-local">

    <label>Entrevista</label>
    <select id="mOnline">
      <option value="">— não definido —</option>
      <option value="true">💻 Online</option>
      <option value="false">🏢 Presencial</option>
    </select>

    <label>Quem fez/vai fazer a entrevista</label>
    <input id="mEntrevistador" placeholder="Nome do entrevistador">

    <label>Observação da entrevista</label>
    <textarea id="mObsEntrevista" rows="2"></textarea>

    <label>Motivo da mudança (se estiver reagendando/cancelando)</label>
    <input id="mMotivo" placeholder="Ex: candidato pediu pra remarcar">

    <div class="modal-label" style="font-size:11px;font-weight:700;color:#888;margin-top:12px">Histórico</div>
    <div id="mHistorico" style="max-height:120px;overflow-y:auto"></div>

    <div class="modal-footer">
      <button class="ghost" id="mCancelar">Fechar</button>
      <button class="primary2" id="mSalvar">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="colunasModal">
  <div class="modal" style="width:480px">
    <h3>⚙️ Gerenciar colunas do Kanban</h3>
    <div style="font-size:11px;color:#888;margin-bottom:10px">Arraste pra reordenar • renomeie • escolha a cor</div>
    <div id="colunasList"></div>
    <button id="btnAddColuna" style="width:100%;padding:10px;border:2px dashed #dde1e7;border-radius:8px;background:none;cursor:pointer;font-size:13px;color:#888;margin:10px 0">+ Adicionar coluna</button>
    <div id="colunasMsg" style="font-size:12px;margin-bottom:8px"></div>
    <div class="modal-footer">
      <button class="ghost" id="btnFecharColunas">Fechar</button>
      <button class="primary2" id="btnSalvarColunas">💾 Salvar colunas</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="dayModal">
  <div class="modal" style="width:440px">
    <h3 id="dayModalTitle">Agendamentos do dia</h3>
    <div id="dayModalList"></div>
    <div class="modal-footer">
      <button class="ghost" id="btnFecharDay">Fechar</button>
    </div>
  </div>
</div>

<script src="agendamentos.js"></script>
</body>
</html>
