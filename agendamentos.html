<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agendamentos — RH Imob</title>
<style>
  body{font-family:system-ui,Arial;margin:0;background:#f0f2f5;color:#111}
  header{background:#111;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;flex:1}
  header input{padding:8px 12px;border-radius:8px;border:0;min-width:200px}
  header button{padding:8px 14px;border-radius:8px;border:0;cursor:pointer;font-size:12px;background:rgba(255,255,255,.15);color:#fff}
  main{max-width:1000px;margin:20px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px;margin-bottom:16px}
  label{font-weight:600;font-size:12px;color:#333;display:block;margin-top:10px}
  input{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border:1px solid #ccc;border-radius:8px;font-size:13px}
  button.primary{padding:9px 14px;border-radius:8px;border:0;background:#111;color:#fff;cursor:pointer;font-size:13px}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;vertical-align:top}
  th{color:#666;font-size:11px;text-transform:uppercase}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#e8f5e9;color:#1b5e20}
  .badge.pendente{background:#fff3e0;color:#e65100}
  .hide{display:none !important}
  small{color:#666}
  .empty{text-align:center;color:#999;padding:40px 0}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:500}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;padding:22px;width:420px;max-height:85vh;overflow-y:auto}
  .modal h3{margin-top:0;font-size:15px}
  .modal label{display:flex;align-items:center;gap:6px;font-weight:600}
  .modal label.checkbox{flex-direction:row}
  .modal input[type="checkbox"]{width:auto}
  textarea{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border:1px solid #ccc;border-radius:8px;font-size:13px;font-family:inherit}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  button.ghost{background:#eee;color:#333}
  button.editBtn{padding:5px 10px;font-size:11px;background:#0b3b6f;color:#fff;border:0;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>🗓 Agendamentos — RH Imob</h1>
  <input id="searchInput" placeholder="Buscar por nome, telefone, empresa ou operador...">
</header>
<main>

  <div class="card" id="loginCard">
    <label>Senha de admin</label>
    <input id="adminPass" type="password" placeholder="••••••••">
    <div style="margin-top:10px"><button class="primary" id="btnEntrar">Entrar</button></div>
    <div id="loginMsg" style="font-size:12px;margin-top:8px"></div>
  </div>

  <div id="appArea" class="hide">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span id="statTotal" style="font-size:12px;color:#666">0 agendamentos</span>
        <button class="primary" id="btnRefresh">↻ Atualizar</button>
      </div>
      <table>
        <thead>
          <tr><th>Data/Hora</th><th>Candidato</th><th>Telefone</th><th>Empresa</th><th>Operador</th><th>Confirmado</th><th>Entrevista</th><th></th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty hide">Nenhum agendamento ainda.</div>
    </div>
  </div>

</main>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Acompanhamento do agendamento</h3>
    <label class="checkbox"><input type="checkbox" id="mConfirmado"> Confirmado pelo candidato</label>
    <label>Data final do 1º agendamento</label>
    <input id="mDataFinal" type="datetime-local">
    <label>Data de reagendamento (se necessário)</label>
    <input id="mDataReag" type="datetime-local">
    <label class="checkbox"><input type="checkbox" id="mOnline"> Entrevista online</label>
    <label>Quem fez a entrevista</label>
    <input id="mEntrevistador" placeholder="Nome do entrevistador">
    <label>Observação da entrevista</label>
    <textarea id="mObsEntrevista" rows="3" placeholder="Como foi a entrevista..."></textarea>
    <div class="modal-footer">
      <button class="ghost" id="mCancelar">Cancelar</button>
      <button class="primary" id="mSalvar">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="agendamentos.js"></script>
</body>
</html>
