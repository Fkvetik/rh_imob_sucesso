<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CRM Agendamentos — RH Imob</title>
<style>
  :root{ --wa-green:#25D366; --wa-dark:#075E54; }
  *{box-sizing:border-box}
  body{font-family:system-ui,Arial;margin:0;background:#f0f2f5;color:#111}
  header{background:#111;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;flex:1}
  header input{padding:8px 12px;border-radius:8px;border:0;min-width:220px}
  header button{padding:8px 14px;border-radius:8px;border:0;cursor:pointer;font-size:12px;background:rgba(255,255,255,.15);color:#fff}
  header button.primary{background:var(--wa-green);color:#fff;font-weight:700}
  .hide{display:none !important}

  .card{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px}
  #loginArea{max-width:360px;margin:60px auto}
  label{font-weight:600;font-size:12px;color:#333;display:block;margin-top:10px}
  input,textarea,select{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border:1px solid #ccc;border-radius:8px;font-size:13px;font-family:inherit}

  /* Dashboard */
  #dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px 20px 0}
  .stat{background:#fff;border-radius:12px;padding:14px;border:1px solid #eee}
  .stat .num{font-size:22px;font-weight:800;color:#111}
  .stat .label{font-size:11px;color:#777;margin-top:2px}
  .stat.wide{grid-column:span 2}
  .stat ul{list-style:none;margin:6px 0 0;padding:0;font-size:11px;color:#555}
  .stat li{display:flex;justify-content:space-between;padding:2px 0}

  /* Kanban */
  #board{display:flex;gap:14px;padding:16px 20px;overflow-x:auto;align-items:flex-start}
  .column{background:#e9edf0;border-radius:12px;min-width:250px;max-width:250px;display:flex;flex-direction:column;max-height:calc(100vh - 260px)}
  .col-header{padding:10px 12px;border-bottom:2px solid var(--col-color,#3498db);font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center}
  .col-count{background:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;color:#555}
  .col-body{padding:8px;overflow-y:auto;flex:1;min-height:60px}
  .col-body.drag-over{background:#dfe9e3}
  .empty-col{text-align:center;color:#999;font-size:11px;padding:20px 8px}
  .agcard{background:#fff;border-radius:10px;padding:9px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:grab;font-size:12px}
  .agcard .nome{font-weight:700}
  .agcard .sub{color:#666;font-size:11px;margin-top:2px}
  .agcard .badge2{display:inline-block;font-size:10px;background:#fff3e0;color:#e65100;border-radius:999px;padding:1px 6px;margin-top:4px}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:500}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;padding:22px;width:440px;max-height:85vh;overflow-y:auto}
  .modal h3{margin-top:0;font-size:15px}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  button.ghost{background:#eee;color:#333;padding:9px 14px;border-radius:8px;border:0;cursor:pointer;font-size:13px}
  button.primary2{background:#111;color:#fff;padding:9px 14px;border-radius:8px;border:0;cursor:pointer;font-size:13px}
  .hist-item{border-left:2px solid #ddd;padding:4px 0 4px 10px;font-size:11px;color:#555;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <h1>🗓 CRM Agendamentos — RH Imob</h1>
  <input id="searchInput" placeholder="Buscar por nome, telefone, empresa ou operador...">
  <button id="btnRefresh">↻ Atualizar</button>
</header>

<div id="loginArea">
  <div class="card">
    <label>Senha de admin</label>
    <input id="adminPass" type="password" placeholder="••••••••">
    <div style="margin-top:10px"><button class="primary2" id="btnEntrar">Entrar</button></div>
    <div id="loginMsg" style="font-size:12px;margin-top:8px"></div>
  </div>
</div>

<div id="appArea" class="hide">
  <div id="dashboard"></div>
  <div id="board"></div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3 id="mNomeCandidato">Agendamento</h3>
    <div style="font-size:12px;color:#666" id="mSubInfo"></div>

    <label>Etapa</label>
    <select id="mStatus">
      <option value="AGENDADO">📨 Agendado</option>
      <option value="CONFIRMADO">✅ Confirmado</option>
      <option value="REALIZADO">🎯 Realizado</option>
      <option value="REAGENDADO">🔁 Reagendado</option>
      <option value="DESISTIU">🚫 Desistiu</option>
      <option value="CANCELADO">⛔ Cancelado</option>
    </select>

    <label>Data/hora (atual ou novo reagendamento)</label>
    <input id="mData" type="datetime-local">

    <label>Entrevista</label>
    <select id="mOnline">
      <option value="">— não definido —</option>
      <option value="true">💻 Online</option>
      <option value="false">🏢 Presencial</option>
    </select>

    <label>Quem fez/vai fazer a entrevista</label>
    <input id="mEntrevistador" placeholder="Nome do entrevistador">

    <label>Observação da entrevista</label>
    <textarea id="mObsEntrevista" rows="2"></textarea>

    <label>Motivo da mudança (se estiver reagendando/cancelando)</label>
    <input id="mMotivo" placeholder="Ex: candidato pediu pra remarcar">

    <div class="modal-label" style="font-size:11px;font-weight:700;color:#888;margin-top:12px">Histórico</div>
    <div id="mHistorico" style="max-height:120px;overflow-y:auto"></div>

    <div class="modal-footer">
      <button class="ghost" id="mCancelar">Fechar</button>
      <button class="primary2" id="mSalvar">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="agendamentos.js"></script>
</body>
</html>
