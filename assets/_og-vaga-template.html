<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100vw; height:100vh; overflow:hidden; }
  .card {
    width:100vw; height:100vh; position:relative; overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:
      radial-gradient(circle at 92% 8%, rgba(255,122,26,.38), transparent 46%),
      radial-gradient(circle at 12% 96%, rgba(109,45,242,.35), transparent 45%),
      linear-gradient(135deg,#180826 0%,#2b124d 52%,#3b1a6b 100%);
    color:#fff;
  }
  /* linhas decorativas (circuito/skyline) à direita */
  .art { position:absolute; right:-40px; top:0; height:630px; width:620px; opacity:.5; }
  .brand { position:absolute; top:56px; left:72px; display:flex; align-items:center; gap:18px; }
  .brand .mark {
    width:66px; height:66px; border-radius:50%;
    background:linear-gradient(135deg,#6d2df2,#ff7a1a);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:24px; letter-spacing:-.03em;
    box-shadow:0 10px 30px rgba(109,45,242,.5);
  }
  .brand .txt strong { display:block; font-size:28px; font-weight:900; letter-spacing:-.02em; line-height:1; }
  .brand .txt small { display:block; font-size:14px; font-weight:700; color:rgba(255,255,255,.6); letter-spacing:.14em; text-transform:uppercase; margin-top:5px; }

  .body { position:absolute; left:72px; top:188px; max-width:630px; }
  .badge {
    display:inline-flex; align-items:center; gap:10px;
    background:rgba(255,122,26,.16); border:1.5px solid rgba(255,122,26,.5);
    color:#ffab40; font-size:17px; font-weight:900; letter-spacing:.12em; text-transform:uppercase;
    padding:10px 20px; border-radius:40px; margin-bottom:22px;
  }
  .badge .dot { width:11px; height:11px; border-radius:50%; background:#ff7a1a; box-shadow:0 0 0 5px rgba(255,122,26,.25); }
  h1 { font-size:54px; font-weight:900; letter-spacing:-.035em; line-height:1.06; margin-bottom:18px; }
  h1 .hl { color:#ffab40; }
  .sub { font-size:21px; font-weight:600; color:rgba(255,255,255,.78); line-height:1.4; max-width:560px; }

  .foot { position:absolute; left:72px; bottom:48px; display:flex; align-items:center; gap:16px; }
  .foot .url { font-size:22px; font-weight:800; color:#fff; }
  .foot .sep { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.4); }
  .foot .tag { font-size:18px; font-weight:700; color:rgba(255,255,255,.6); }
  .stripe { position:absolute; left:0; bottom:0; width:100%; height:8px; background:linear-gradient(90deg,#6d2df2,#ff7a1a); }
</style>
</head>
<body>
<div class="card">
  <svg class="art" viewBox="0 0 620 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- prédios em linha -->
    <g stroke="rgba(255,255,255,.55)" stroke-width="2">
      <rect x="330" y="300" width="90" height="250" rx="4"/>
      <rect x="435" y="220" width="110" height="330" rx="4"/>
      <rect x="560" y="360" width="80" height="190" rx="4"/>
      <rect x="235" y="390" width="80" height="160" rx="4"/>
    </g>
    <g fill="rgba(255,171,64,.65)">
      <rect x="348" y="322" width="16" height="16"/><rect x="380" y="322" width="16" height="16"/>
      <rect x="348" y="360" width="16" height="16"/><rect x="380" y="360" width="16" height="16"/>
      <rect x="455" y="248" width="18" height="18"/><rect x="492" y="248" width="18" height="18"/>
      <rect x="455" y="292" width="18" height="18"/><rect x="492" y="292" width="18" height="18"/>
      <rect x="455" y="336" width="18" height="18"/><rect x="492" y="336" width="18" height="18"/>
    </g>
    <!-- linha de crescimento -->
    <polyline points="235,200 320,150 400,175 500,95 600,120" stroke="#ff7a1a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ff7a1a"><circle cx="320" cy="150" r="6"/><circle cx="500" cy="95" r="6"/></g>
    <!-- nós de rede -->
    <g stroke="rgba(255,255,255,.3)" stroke-width="1.5">
      <line x1="120" y1="90" x2="200" y2="140"/><line x1="200" y1="140" x2="150" y2="230"/>
    </g>
    <g fill="rgba(255,255,255,.4)"><circle cx="120" cy="90" r="5"/><circle cx="200" cy="140" r="5"/><circle cx="150" cy="230" r="5"/></g>
  </svg>

  <div class="brand">
    <div class="mark">RH</div>
    <div class="txt"><strong>RH IMOB</strong><small>Recrutamento imobiliário</small></div>
  </div>

  <div class="body">
    <div class="badge"><span class="dot"></span> Vaga aberta</div>
    <h1>Sua próxima <span class="hl">oportunidade</span> no mercado imobiliário.</h1>
    <div class="sub">Candidatura direta, sem burocracia. Vagas com estrutura, leads e responsável dedicada.</div>
  </div>

  <div class="foot">
    <span class="url">rhimob.com.br/vagas</span>
    <span class="sep"></span>
    <span class="tag">52 mil profissionais · 360 cidades</span>
  </div>
  <div class="stripe"></div>
</div>
</body>
</html>
