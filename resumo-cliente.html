<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Resumo do período — RH IMOB</title>
<link rel="icon" href="favicon.svg">
<style>
  :root{--roxo:#4b178b;--roxo-esc:#2b124d;--laranja:#f08a24;--texto:#231a30;--suave:#6b6478;--borda:#ece8f3;--fundo:#f7f5fb}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:var(--fundo)}
  .barra{display:flex;gap:10px;align-items:end;flex-wrap:wrap;max-width:900px;margin:16px auto 0;padding:0 16px}
  .barra label{font-size:11px;color:var(--suave);display:block;margin-bottom:3px}
  .barra input{padding:7px 9px;border:1px solid #d9d3e6;border-radius:8px;font:inherit;font-size:13px}
  .barra button{padding:8px 14px;border:0;border-radius:8px;background:var(--roxo);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
  .barra button.sec{background:#fff;color:var(--roxo);border:1px solid var(--roxo)}
  .folha{max-width:900px;margin:16px auto 32px;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(43,18,77,.08);overflow:hidden}
  .topo{background:linear-gradient(120deg,var(--roxo-esc),var(--roxo));color:#fff;padding:24px 28px;display:flex;gap:18px;align-items:center}
  .topo img{width:52px;height:52px;border-radius:10px;background:#fff}
  .topo h1{margin:0;font-size:20px}
  .topo p{margin:4px 0 0;opacity:.85;font-size:13px}
  .corpo{padding:24px 28px}
  h2{font-size:14px;color:var(--roxo);margin:26px 0 12px;text-transform:uppercase;letter-spacing:.04em}
  h2:first-child{margin-top:0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{border:1px solid var(--borda);border-radius:12px;padding:14px}
  .kpi .n{font-size:28px;font-weight:800;color:var(--roxo-esc);font-variant-numeric:tabular-nums}
  .kpi .t{font-size:12px;color:var(--suave);margin-top:2px}
  .kpi .p{font-size:12px;color:var(--laranja);font-weight:700;margin-top:6px}
  .funil{display:flex;flex-direction:column;gap:8px}
  .etapa{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
  .etapa .b{height:22px;border-radius:6px;background:var(--roxo);min-width:2px}
  .etapa .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .semanas{display:flex;align-items:flex-end;gap:6px;height:140px;border-bottom:1px solid var(--borda);padding-top:16px}
  .sem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--suave)}
  .sem .b{width:100%;max-width:46px;background:var(--laranja);border-radius:5px 5px 0 0}
  .sem .q{font-weight:700;color:var(--texto);margin-bottom:3px}
  .rot{display:flex;gap:6px}.rot span{flex:1;text-align:center;font-size:10px;color:var(--suave);padding-top:4px}
  .nota{font-size:12px;color:var(--suave);margin-top:22px;line-height:1.5}
  .codigo{font-size:11px;color:var(--suave);margin-top:10px;border-top:1px solid var(--borda);padding-top:10px}
  .emitidos{max-width:900px;margin:0 auto 32px;padding:0 16px;font-size:12px;color:var(--suave)}
  .emitidos table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
  .emitidos td,.emitidos th{padding:6px 10px;border-bottom:1px solid var(--borda);text-align:left}
  .emitidos th{font-size:10px;text-transform:uppercase}
  .msg{max-width:900px;margin:40px auto;padding:0 16px;text-align:center;color:var(--suave)}
  .uso-legenda{font-size:11px;color:var(--suave);margin:10px 0 6px}
  .uso-legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}
  .uso-tab{overflow-x:auto}
  .uso-tab table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  .uso-tab th{text-align:left;font-size:10px;color:var(--suave);font-weight:600;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--borda);white-space:nowrap}
  .uso-tab td{padding:5px 6px;border-bottom:1px solid var(--borda);white-space:nowrap}
  .uso-tab td.bar{width:42%;min-width:200px;white-space:normal}
  .uso-tab tr{break-inside:avoid}
  .uso-tab tr.nao td{background:#fff3f2}.uso-tab tr.nao .st{color:#b42318;font-weight:700}
  .uso-tab tr.fds td{color:#a39cae}
  .ub{display:flex;height:12px;border-radius:3px;overflow:hidden;background:#e7e5ec}
  .ub span{flex:1}
  .ub.sem{background:repeating-linear-gradient(45deg,#f1eff5 0 5px,#fff 5px 10px)}
  .eixo{display:flex;justify-content:space-between;font-size:9px;color:var(--suave);font-weight:400;text-transform:none}
  @media (max-width:600px){.etapa{grid-template-columns:110px 1fr 50px}.topo,.corpo{padding:18px}}
  @media print{body{background:#fff}.barra,.emitidos{display:none}.folha{box-shadow:none;margin:0;max-width:none;border-radius:0}
    .topo{-webkit-print-color-adjust:exact;print-color-adjust:exact}.etapa .b,.sem .b,.ub,.ub span,.uso-legenda i,.uso-tab tr.nao td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="barra" id="barra">
  <div><label for="de">De</label><input type="date" id="de"></div>
  <div><label for="ate">Até</label><input type="date" id="ate"></div>
  <button id="btnAtualizar">Atualizar</button>
  <button id="btnImprimir" class="sec">🖨 Imprimir / salvar PDF</button>
</div>
<div id="saida"><div class="msg">Carregando...</div></div>
<div class="emitidos" id="emitidos"></div>

<script>
// Resumo de um cliente (operador) num período. Duas portas:
//  • admin: botão 📊 Resumo no painel (mesma sessão de admin, ?login=&empresa=);
//  • operador: Kanban da extensão → Visão geral → 📄 Meu resumo (?k=<link de
//    10 min>, SQL RELAT_1) — só os dados dele, sem senha de admin.
// Ao imprimir, o relatório ganha um código (rpc_relatorio_emitir) que vai no
// nome do PDF e no rodapé. Números: SQL RESUMO_1 / SAUDE_3.
(function(){
  const SUPABASE_URL = "https://lrejfhsomfxyaoshmpzz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyZWpmaHNvbWZ4eWFvc2htcHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTQxNzIsImV4cCI6MjEwMTY5MDE3Mn0.FfdMC8jJaWGTUxDVIh5TVcXrRBIWAaMXX6HZNLIQ28Y";
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const login = q.get("login") || "";
  const chave = (q.get("k") || "").replace(/[^a-f0-9]/g, "");
  let empresa = q.get("empresa") || "";
  let atual = null;   // o que está na tela (para o nome do PDF e o código)
  const hoje = new Date().toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
  const menos30 = (() => { const d = new Date(hoje + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - 29); return d.toISOString().slice(0, 10); })();
  $("de").value = q.get("de") || menos30;
  $("ate").value = q.get("ate") || hoje;

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const num = n => Number(n || 0).toLocaleString("pt-BR");
  const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
  const dataBR = iso => { if (!iso) return "—"; const [a, m, d] = String(iso).slice(0, 10).split("-"); return `${d}/${m}/${a}`; };

  function senha() {
    let s = "";
    try { s = sessionStorage.getItem("catho_admin_pass") || ""; } catch (_) {}
    return s;
  }

  const rpc = (nome, corpo) => fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
    body: JSON.stringify(corpo)
  });
  // Nome do arquivo: o Chrome usa o título da página. Sem "/" (vira "_") e sem caracteres proibidos no Windows.
  const dataArq = iso => dataBR(iso).replace(/\//g, "-");
  const limpaArq = t => String(t || "").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
  function tituloPdf(codigo) {
    if (!atual) return;
    document.title = ["RH IMOB", "Relatório", empresa, atual.nome || atual.login, `${dataArq(atual.de)} a ${dataArq(atual.ate)}`, codigo]
      .filter(Boolean).map(limpaArq).join(" - ");
  }

  async function carregarOperador() {
    $("saida").innerHTML = '<div class="msg">Carregando...</div>';
    try {
      const r = await rpc("rpc_operador_resumo", { p_chave: chave, p_de: $("de").value, p_ate: $("ate").value });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error((d && (d.error || d.message)) || ("HTTP " + r.status));
      empresa = d.empresa || empresa;
      render(d, d.uso && d.uso.ok ? d.uso : null);
    } catch (e) {
      $("saida").innerHTML = `<div class="msg">❌ ${esc(e.message)}</div>`;
    }
  }

  async function listarEmitidos() {
    if (chave || !login) return;
    try {
      const d = await (await rpc("rpc_admin_relatorios", { p_admin_password: senha(), p_login: login })).json();
      const l = d && d.ok ? d.lista : [];
      $("emitidos").innerHTML = !l.length ? "" : `<h2>Relatórios já emitidos deste operador</h2>
        <table><tr><th>Código</th><th>Período</th><th>Gerado em</th><th>Por</th></tr>
        ${l.map(x => `<tr><td><b>${esc(x.codigo)}</b></td><td>${dataBR(x.de)} a ${dataBR(x.ate)}</td><td>${esc(x.gerado_em)}</td><td>${x.origem === "OPERADOR" ? "o próprio operador" : esc(x.gerado_por)}</td></tr>`).join("")}</table>`;
    } catch (_) {}
  }

  async function imprimir() {
    const b = $("btnImprimir");
    if (atual) {
      b.disabled = true;
      try {
        const corpo = chave ? { p_admin_password: null, p_chave: chave, p_login: null, p_de: atual.de, p_ate: atual.ate }
                            : { p_admin_password: senha(), p_chave: null, p_login: login, p_de: atual.de, p_ate: atual.ate, p_empresa: empresa || null };
        const d = await (await rpc("rpc_relatorio_emitir", corpo)).json();
        if (d && d.ok) {
          tituloPdf(d.codigo);
          const c = $("codigoRel");
          if (c) c.textContent = `Relatório nº ${d.codigo} · gerado em ${d.gerado_em} · RH IMOB`;
          listarEmitidos();
        }
      } catch (_) {}   // sem o SQL RELAT_1, imprime sem código
      b.disabled = false;
    }
    window.print();
  }

  async function carregar() {
    if (chave) return carregarOperador();
    if (!login) { $("saida").innerHTML = '<div class="msg">Abra este resumo pelo painel admin (botão 📊 Resumo do operador).</div>'; return; }
    const pass = senha();
    if (!pass) { $("saida").innerHTML = '<div class="msg">Sessão de admin não encontrada nesta aba. Abra o resumo pelo botão 📊 Resumo no painel admin.</div>'; return; }
    $("saida").innerHTML = '<div class="msg">Carregando...</div>';
    const corpo = { p_admin_password: pass, p_login: login, p_de: $("de").value, p_ate: $("ate").value };
    try {
      // uso da ferramenta (SQL SAUDE_3): se faltar, o resumo sai sem essa seção
      const usoP = rpc("rpc_admin_uso_periodo", corpo).then(x => x.json()).then(u => u && u.ok ? u : null).catch(() => null);
      const r = await rpc("rpc_admin_resumo_cliente", corpo);
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error((d && (d.error || d.message)) || ("HTTP " + r.status));
      render(d, await usoP);
      listarEmitidos();
    } catch (e) {
      $("saida").innerHTML = `<div class="msg">❌ ${esc(e.message)}</div>`;
    }
  }

  // ---------- Uso da ferramenta: um dia por linha, barra de 0h a 24h ----------
  const USO_COR = ["", "#f5c451", "#22a55a"]; // ligada sem disparar · disparando
  const horas = min => { if (!min) return "—"; const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h${m ? String(m).padStart(2, "0") : ""}` : `${m} min`; };
  const minDe = hhmm => { const [h, m] = String(hhmm).split(":").map(Number); return h * 60 + m; };
  function barraUso(blocos, sem) {
    if (sem) return '<div class="ub sem"></div>';
    const est = new Array(96).fill(0);
    (blocos || []).forEach(([i, e]) => { if (i >= 0 && i < 96) est[i] = e; });
    return `<div class="ub">${est.map(e => `<span${e ? ` style="background:${USO_COR[e]}"` : ""}></span>`).join("")}</div>`;
  }
  function secaoUso(u) {
    if (!u) return "";
    const desde = u.historico_desde ? u.historico_desde.slice(6, 10) + "-" + u.historico_desde.slice(3, 5) + "-" + u.historico_desde.slice(0, 2) : null;
    const linhas = (u.linhas || []).slice().reverse().map(x => {
      const dow = new Date(x.dia + "T12:00:00Z").getUTCDay();
      const fds = dow === 0 || dow === 6;
      const sem = !x.blocos.length && (!desde || x.dia < desde);   // antes do acompanhamento começar
      const usou = x.blocos.length > 0;
      return Object.assign({}, x, { fds, sem, usou, nao: !sem && !usou && !fds && x.dia !== hoje });
    });
    const acomp = linhas.filter(x => !x.sem);
    const uteis = acomp.filter(x => !x.fds && (x.usou || x.dia !== hoje)); // hoje ainda sem uso não conta como falta
    const usados = uteis.filter(x => x.usou);
    const comInicio = acomp.filter(x => x.primeiro);
    const inicioMedio = comInicio.length ? Math.round(comInicio.reduce((s, x) => s + minDe(x.primeiro), 0) / comInicio.length) : null;
    const somar = k => acomp.reduce((s, x) => s + (x[k] || 0), 0);
    const nomeDia = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "UTC" });
    return `
        <h2>Uso da ferramenta</h2>
        ${acomp.length ? `
        <div class="kpis">
          <div class="kpi"><div class="n">${usados.length}<span style="font-size:16px;color:var(--suave)"> de ${uteis.length}</span></div><div class="t">dias úteis com a extensão ligada</div>${uteis.length - usados.length ? `<div class="p" style="color:#b42318">${uteis.length - usados.length} dia(s) útil(eis) sem uso</div>` : ""}</div>
          <div class="kpi"><div class="n">${horas(somar("min_ligada"))}</div><div class="t">extensão ligada</div></div>
          <div class="kpi"><div class="n">${horas(somar("min_disparando"))}</div><div class="t">disparando mensagens</div></div>
          <div class="kpi"><div class="n">${inicioMedio == null ? "—" : String(Math.floor(inicioMedio / 60)).padStart(2, "0") + ":" + String(inicioMedio % 60).padStart(2, "0")}</div><div class="t">horário médio de início</div></div>
        </div>` : `<p class="nota" style="margin-top:0">O acompanhamento do uso ainda não tem registros neste período.</p>`}
        <div class="uso-legenda">Linha do dia, de 0h a 24h:<i style="background:#e7e5ec"></i>desligada<i style="background:${USO_COR[1]}"></i>ligada sem disparar<i style="background:${USO_COR[2]}"></i>disparando mensagens</div>
        <div class="uso-tab"><table>
          <thead><tr><th>Dia</th><th class="bar"><div class="eixo"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div></th><th>Início–fim</th><th>Ligada</th><th>Disparando</th><th>Enviadas</th><th>Respostas</th></tr></thead>
          <tbody>${linhas.map(x => `
            <tr class="${x.nao ? "nao" : x.fds && !x.usou ? "fds" : ""}">
              <td>${esc(nomeDia(x.dia))}</td>
              <td class="bar">${barraUso(x.blocos, x.sem)}</td>
              <td class="st">${x.sem ? "sem registro" : x.usou ? `${esc(x.primeiro)}–${esc(x.ultimo)}` : x.nao ? "Não usada" : x.fds ? "fim de semana" : "—"}</td>
              <td>${x.sem ? "—" : horas(x.min_ligada)}</td>
              <td>${x.sem ? "—" : horas(x.min_disparando)}</td>
              <td>${x.enviadas ? num(x.enviadas) : "—"}</td>
              <td>${x.respostas ? num(x.respostas) : "—"}</td>
            </tr>`).join("")}</tbody>
        </table></div>
        <p class="nota" style="margin-top:10px">
          "Ligada" é o tempo em que a extensão esteve aberta e funcionando no computador do operador (medido em blocos de 15 minutos);
          "disparando" é o tempo em que ela estava enviando as mensagens da fila, com o WhatsApp aberto. "Início–fim" é o primeiro e o último horário do dia.
          ${desde && linhas.some(x => x.sem) ? `O acompanhamento do uso começou em ${esc(u.historico_desde.slice(0, 10))}; os dias anteriores aparecem como "sem registro".` : ""}
        </p>`;
  }

  function render(d, uso) {
    const n = d.numeros || {};
    const recebidos = (n.recebidos_catho || 0) + (n.recebidos_banco || 0) + (n.recebidos_creci || 0) + (n.recebidos_outros || 0);
    const etapas = [
      ["Abordados", n.abordados], ["Responderam", n.responderam],
      ["Receberam a proposta", n.proposta], ["Agendaram", n.agendaram]
    ];
    const maxEtapa = Math.max(1, ...etapas.map(e => e[1] || 0));
    const semanas = d.por_semana || [];
    const maxSem = Math.max(1, ...semanas.map(s => s.abordados || 0));
    atual = { login: d.login, nome: d.nome, de: String(d.de).slice(0, 10), ate: String(d.ate).slice(0, 10) };
    tituloPdf(null);

    $("saida").innerHTML = `
    <div class="folha">
      <div class="topo">
        <img src="assets/rhimob-logo.jpg" alt="RH IMOB">
        <div>
          <h1>Resumo do período — ${esc(d.nome || d.login)}</h1>
          <p>${empresa ? esc(empresa) + " · " : ""}${dataBR(d.de)} a ${dataBR(d.ate)} · Extensão RH IMOB Aceleradora</p>
        </div>
      </div>
      <div class="corpo">
        <h2>Resultado</h2>
        <div class="kpis">
          <div class="kpi"><div class="n">${num(recebidos)}</div><div class="t">contatos recebidos</div></div>
          <div class="kpi"><div class="n">${num(n.abordados)}</div><div class="t">abordados no WhatsApp</div></div>
          <div class="kpi"><div class="n">${num(n.responderam)}</div><div class="t">responderam</div><div class="p">${pct(n.responderam, n.abordados)} dos abordados</div></div>
          <div class="kpi"><div class="n">${num(n.agendaram)}</div><div class="t">agendaram</div><div class="p">${pct(n.agendaram, n.abordados)} dos abordados</div></div>
        </div>

        <h2>Funil</h2>
        <div class="funil">
          ${etapas.map(([t, v]) => `<div class="etapa"><span>${t}</span><div class="b" style="width:${Math.round((v || 0) / maxEtapa * 100)}%"></div><span class="v">${num(v)}</span></div>`).join("")}
        </div>

        <h2>Contatos recebidos por origem</h2>
        <div class="kpis">
          <div class="kpi"><div class="n">${num(n.recebidos_catho)}</div><div class="t">Catho (filtros)</div></div>
          <div class="kpi"><div class="n">${num(n.recebidos_banco)}</div><div class="t">Banco de Talentos</div></div>
          <div class="kpi"><div class="n">${num(n.recebidos_creci)}</div><div class="t">Corretores CRECI</div></div>
          ${n.recebidos_outros ? `<div class="kpi"><div class="n">${num(n.recebidos_outros)}</div><div class="t">outras origens (planilha, Instagram)</div></div>` : ""}
        </div>

        ${semanas.length ? `
        <h2>Abordagens por semana</h2>
        <div class="semanas">${semanas.map(s => `<div class="sem"><span class="q">${num(s.abordados)}</span><div class="b" style="height:${Math.max(2, Math.round((s.abordados || 0) / maxSem * 100))}%"></div></div>`).join("")}</div>
        <div class="rot">${semanas.map(s => `<span>${dataBR(s.semana).slice(0, 5)}</span>`).join("")}</div>` : ""}

        ${secaoUso(uso)}

        <p class="nota">
          ${d.acesso_fim ? `Acesso contratado: ${dataBR(d.acesso_inicio)} a ${dataBR(d.acesso_fim)}.<br>` : ""}
          Contagens por data do evento no período (horário de Brasília). "Responderam", "proposta" e "agendaram" contam as pessoas que chegaram a essa etapa dentro do período.
        </p>
        <p class="codigo" id="codigoRel"></p>
      </div>
    </div>`;
  }

  $("btnAtualizar").addEventListener("click", carregar);
  $("btnImprimir").addEventListener("click", imprimir);
  carregar();
})();
</script>
